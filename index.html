<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional OEM Configurator</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { border-bottom: 2px solid var(--primary); padding-bottom: 10px; font-size: 24px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .section { border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; }
        h3 { margin-top: 0; color: var(--primary); font-size: 16px; text-transform: uppercase; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
        select, input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
        .total-box { margin-top: 25px; padding: 20px; background: #1e293b; color: white; border-radius: 8px; text-align: center; }
        .price-display { font-size: 32px; font-weight: bold; color: #60a5fa; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="container">
    <h1>OEM Sensor & Heater Configurator</h1>
    
    <div class="grid">
        <div class="section">
            <h3>1. Core Specification</h3>
            <label>Product Category</label>
            <select id="category">
                <option value="sensor">Temperature Sensor</option>
                <option value="heater">Industrial Heater</option>
                <option value="level">Level Sensor</option>
            </select>

            <label>Internal Element</label>
            <select id="element">
                <option value="15">PT100 Class A</option>
                <option value="8">Type K Thermocouple</option>
                <option value="45">Ceramic Heater Core</option>
                <option value="30">Magnetic Float Switch</option>
            </select>
            
            <label>Quantity</label>
            <input type="number" id="qty" value="10">
        </div>

        <div class="section">
            <h3>2. Tube & Dimensions</h3>
            <label>Tube Material</label>
            <select id="tubeMat">
                <option value="0.05">SS304 ($0.05/mm)</option>
                <option value="0.09">SS316L ($0.09/mm)</option>
                <option value="0.22">Inconel 600 ($0.22/mm)</option>
            </select>

            <label>Outer Diameter (OD)</label>
            <select id="od">
                <option value="1.0">3.0mm / 1/8"</option>
                <option value="1.2">6.0mm / 1/4" (x1.2 Multiplier)</option>
                <option value="1.8">12.0mm / 1/2" (x1.8 Multiplier)</option>
            </select>

            <label>Tube Length (mm)</label>
            <input type="number" id="tubeLen" value="150">
        </div>

        <div class="section">
            <h3>3. Wire & Leads</h3>
            <label>Wire Type</label>
            <select id="wireType">
                <option value="0.02">PVC Lead ($0.02/mm)</option>
                <option value="0.05">Teflon (PTFE) ($0.05/mm)</option>
                <option value="0.08">Fiberglass Braided ($0.08/mm)</option>
            </select>

            <label>Wire Length (mm)</label>
            <input type="number" id="wireLen" value="1000">
        </div>

        <div class="section">
            <h3>4. Accessories</h3>
            <label>Process Fitting</label>
            <select id="fitting">
                <option value="0">None</option>
                <option value="12">1/2" NPT Fixed Thread</option>
                <option value="18">Compression Fitting (Adjustable)</option>
            </select>

            <label>Enclosure / Head</label>
            <select id="enclosure">
                <option value="0">None (Stripped Ends)</option>
                <option value="25">Aluminum Connection Head</option>
                <option value="65">Ex-Proof Stainless Head</option>
            </select>

            <label>Connector</label>
            <select id="connector">
                <option value="0">None</option>
                <option value="5">Standard M/F Plug</option>
                <option value="12">M12 Industrial Connector</option>
            </select>
        </div>
    </div>

    <div class="total-box">
        <div id="unitDisplay">Unit Price: $0.00</div>
        <div class="price-display" id="totalDisplay">Total: $0.00</div>
        <p style="font-size: 12px; margin-top: 10px; opacity: 0.8;">*Includes Engineering Setup Fee</p>
    </div>

    <button onclick="calculate()">Calculate OEM Quote</button>
</div>

<script>
    function calculate() {
        // Get Values
        const qty = parseInt(document.getElementById('qty').value) || 1;
        const elementCost = parseFloat(document.getElementById('element').value);
        const tubeRate = parseFloat(document.getElementById('tubeMat').value);
        const tubeLen = parseFloat(document.getElementById('tubeLen').value);
        const odMultiplier = parseFloat(document.getElementById('od').value);
        
        const wireRate = parseFloat(document.getElementById('wireType').value);
        const wireLen = parseFloat(document.getElementById('wireLen').value);
        
        const accessoryCost = 
            parseFloat(document.getElementById('fitting').value) +
            parseFloat(document.getElementById('enclosure').value) +
            parseFloat(document.getElementById('connector').value);

        // Logic
        let setupFee = 100; // Fixed cost for labor/setup
        let tubeTotal = (tubeLen * tubeRate) * odMultiplier;
        let wireTotal = (wireLen * wireRate);
        
        let unitCost = elementCost + tubeTotal + wireTotal + accessoryCost;
        
        // Margin scaling
        let margin = 2.0;
        if (qty >= 100) margin = 1.4;
        else if (qty >= 10) margin = 1.6;

        let totalQuote = (setupFee + (unitCost * qty)) * margin;
        let perUnit = totalQuote / qty;

        // Render
        document.getElementById('totalDisplay').innerText = "Total: $" + totalQuote.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('unitDisplay').innerText = "Unit Price: $" + perUnit.toLocaleString(undefined, {minimumFractionDigits: 2});
    }
</script>

</body>
</html>
